# Pruebas automáticas en cada push y pull request (regresión continua).
# No despliega nada: Dokploy sigue desplegando desde main como siempre.
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (unitarias, integración y BDD)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pruebas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      # Base desechable: las pruebas de integración borran y recrean el esquema en cada prueba
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pruebas
      GOOGLE_DOCUMENT_AI_ENABLED: "false"
      RAPID_OCR_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Pruebas
        run: python -m pytest -q

  frontend:
    name: Frontend (tipos y compilación)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Revisión de tipos
        run: npx tsc --noEmit
      - name: Compilación de producción
        run: npm run build

  seguridad:
    name: Seguridad (dependencias y análisis estático)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar herramientas
        run: pip install pip-audit bandit
      - name: Dependencias del backend con avisos conocidos (pip-audit)
        run: pip-audit -r backend/requirements.txt
      - name: Análisis estático del backend (Bandit, severidad media o mayor)
        run: bandit -r backend/app -q -ll
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Dependencias del frontend con avisos conocidos (informativo hasta pasar a Next 16)
        working-directory: frontend
        continue-on-error: true
        run: npm audit --omit=dev
