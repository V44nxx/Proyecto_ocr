<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root {
    --fondo: #f5f6f8; --tarjeta: #ffffff; --borde: #e2e8f0; --texto: #0f172a; --suave: #64748b; --tenue: #94a3b8;
    --acento: #0071e3; --acento-suave: rgba(0, 113, 227, .1); --ok: #059669; --alerta: #d97706; --error: #dc2626;
    --campo: #f8fafc; --sombra: 0 2px 12px rgba(0, 0, 0, .04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fondo: #0b0e14; --tarjeta: #121620; --borde: rgba(255, 255, 255, .08); --texto: #f1f5f9; --suave: #94a3b8;
      --tenue: #64748b; --acento-suave: rgba(0, 113, 227, .18); --campo: rgba(255, 255, 255, .04);
      --sombra: 0 4px 24px rgba(0, 0, 0, .25);
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--fondo); color: var(--texto); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  button, input, select, textarea { font: inherit; color: inherit; }
  .contenedor { padding: 16px; max-width: 1400px; margin: 0 auto; }
  .barra { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 14px; }
  .barra h1 { font-size: 16px; margin: 0; font-weight: 700; }
  .sincro { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--suave); margin-left: auto; }
  .punto { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
  .punto.cargando { background: var(--alerta); animation: latir 1s infinite; }
  .punto.error { background: var(--error); }
  @keyframes latir { 50% { opacity: .35; } }
  .boton { border: 1px solid var(--borde); background: var(--tarjeta); border-radius: 10px; padding: 7px 12px; font-size: 12px; font-weight: 600; cursor: pointer; }
  .boton:hover { border-color: var(--acento); }
  .boton.primario { background: var(--acento); border-color: var(--acento); color: #fff; }
  .boton:disabled { opacity: .45; cursor: not-allowed; }
  .kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
  .kpi { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 14px; padding: 12px 14px; box-shadow: var(--sombra); }
  .kpi span { font-size: 11px; color: var(--suave); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .kpi b { display: block; font-size: 22px; margin-top: 2px; }
  button.kpi { text-align: left; cursor: pointer; }
  button.kpi:hover, button.kpi.activo { border-color: var(--acento); }
  .chips-alerta { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .alerta { font-size: 10.5px; font-weight: 700; border-radius: 6px; padding: 1px 6px; white-space: nowrap; }
  .nota { font-size: 12px; margin: 4px 0 0; padding-left: 16px; }
  .bloque-alertas { margin-bottom: 18px; }
  .filtros { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  .filtros input, .filtros select { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 10px; padding: 7px 10px; font-size: 13px; }
  .filtros input { flex: 1 1 240px; min-width: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--borde); background: var(--tarjeta); border-radius: 999px; padding: 5px 11px; font-size: 12px; font-weight: 600; cursor: pointer; }
  .chip small { color: var(--tenue); font-weight: 600; margin-left: 4px; }
  .chip.activo { background: var(--acento); border-color: var(--acento); color: #fff; }
  .chip.activo small { color: rgba(255, 255, 255, .75); }
  .lista { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 14px; overflow-x: auto; box-shadow: var(--sombra); }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--suave); padding: 10px 12px; border-bottom: 1px solid var(--borde); white-space: nowrap; }
  td { padding: 10px 12px; border-bottom: 1px solid var(--borde); vertical-align: top; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--acento-suave); }
  tr.cambiado { animation: resaltar 2.5s; }
  @keyframes resaltar { from { background: rgba(5, 150, 105, .18); } }
  .titulo { font-weight: 600; }
  .sub { font-size: 12px; color: var(--suave); }
  .recorte { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .etiqueta { display: inline-block; font-size: 11px; font-weight: 700; border-radius: 6px; padding: 2px 7px; background: var(--campo); border: 1px solid var(--borde); white-space: nowrap; }
  .etiqueta.hoja { color: var(--acento); background: var(--acento-suave); border-color: transparent; }
  .etiqueta.vacia { color: var(--tenue); }
  .vacio { padding: 40px; text-align: center; color: var(--suave); }
  .aviso { font-size: 12px; color: var(--alerta); margin-bottom: 10px; }
  .velo { position: fixed; inset: 0; background: rgba(15, 23, 42, .35); display: none; }
  .velo.abierto { display: block; }
  .cajon { position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 100%); background: var(--tarjeta); border-left: 1px solid var(--borde); transform: translateX(100%); transition: transform .2s; display: flex; flex-direction: column; }
  .cajon.abierto { transform: none; }
  .cajon header { padding: 16px; border-bottom: 1px solid var(--borde); display: flex; gap: 10px; align-items: flex-start; }
  .cajon header h2 { font-size: 15px; margin: 4px 0 0; }
  .cajon .cuerpo { padding: 16px; overflow: auto; flex: 1; }
  .cajon footer { padding: 12px 16px; border-top: 1px solid var(--borde); display: flex; gap: 8px; justify-content: flex-end; align-items: center; }
  .cerrar { margin-left: auto; border: 0; background: none; font-size: 20px; cursor: pointer; color: var(--suave); }
  .detalles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; margin-bottom: 18px; }
  .detalles div span { display: block; font-size: 11px; color: var(--suave); font-weight: 600; }
  .seccion { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--suave); margin: 0 0 10px; }
  .formulario { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .formulario label { font-size: 11px; font-weight: 600; color: var(--suave); display: block; margin-bottom: 4px; }
  .formulario .ancho { grid-column: 1 / -1; }
  .formulario input, .formulario textarea { width: 100%; background: var(--campo); border: 1px solid var(--borde); border-radius: 10px; padding: 8px 10px; }
  .formulario textarea { min-height: 90px; resize: vertical; }
  .formulario input:focus, .formulario textarea:focus { outline: 2px solid var(--acento-suave); border-color: var(--acento); }
  .formulario .modificado { border-color: var(--alerta); }
  .conflicto { font-size: 12px; color: var(--error); margin-top: 4px; }
  .mensaje { margin-right: auto; font-size: 12px; color: var(--suave); }
  .toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: #0f172a; color: #fff; padding: 9px 16px; border-radius: 10px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.visible { opacity: 1; }
  .vistas { display: flex; gap: 4px; border-bottom: 1px solid var(--borde); margin-bottom: 14px; }
  .vistas button { border: 0; background: none; padding: 9px 14px; font-weight: 600; font-size: 13px; color: var(--suave); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .vistas button.activa { color: var(--acento); border-bottom-color: var(--acento); }
  .vistas small { background: var(--acento-suave); color: var(--acento); border-radius: 999px; padding: 1px 7px; margin-left: 4px; font-size: 11px; }
  /* Calendario */
  .cal { display: grid; grid-template-columns: minmax(0, 2.2fr) minmax(280px, 1fr); gap: 14px; align-items: start; }
  .cal-caja { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 14px; box-shadow: var(--sombra); overflow: hidden; }
  .cal-cabeza { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--borde); }
  .cal-cabeza h2 { font-size: 15px; margin: 0 auto 0 4px; text-transform: capitalize; }
  .cal-flecha { border: 1px solid var(--borde); background: var(--tarjeta); border-radius: 8px; width: 30px; height: 30px; cursor: pointer; font-size: 16px; }
  .cal-grilla { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .cal-sem { font-size: 11px; font-weight: 700; color: var(--suave); text-transform: uppercase; padding: 8px; text-align: center; border-bottom: 1px solid var(--borde); }
  .cal-dia { min-height: 104px; padding: 6px; border-right: 1px solid var(--borde); border-bottom: 1px solid var(--borde); cursor: pointer; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .cal-dia:nth-child(7n) { border-right: 0; }
  .cal-dia:hover { background: var(--acento-suave); }
  .cal-dia.fuera { opacity: .4; }
  .cal-dia.elegido { background: var(--acento-suave); box-shadow: inset 0 0 0 2px var(--acento); }
  .cal-num { font-size: 12px; font-weight: 700; width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; }
  .cal-dia.hoy .cal-num { background: var(--acento); color: #fff; }
  .cal-ev { font-size: 11px; font-weight: 600; border-radius: 5px; padding: 2px 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-left: 3px solid; background: var(--campo); }
  .cal-mas, .cal-cuenta { font-size: 10.5px; color: var(--suave); }
  .cal-cuenta b { color: var(--texto); }
  .dia-panel { padding: 14px; }
  .dia-panel h3 { margin: 0 0 2px; font-size: 15px; }
  .dia-panel h3::first-letter, .dia-titulo::first-letter { text-transform: uppercase; }
  .ver-mas { border: 0; background: none; color: var(--acento); font-weight: 600; font-size: 12px; cursor: pointer; padding: 4px 0; }
  .grupo { margin-top: 14px; }
  .grupo h4 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--suave); }
  .item { padding: 8px 10px; border: 1px solid var(--borde); border-left: 3px solid; border-radius: 10px; margin-bottom: 6px; cursor: pointer; }
  .item:hover { border-color: var(--acento); }
  .leyenda { display: flex; flex-wrap: wrap; gap: 10px; padding: 10px 14px; font-size: 11px; color: var(--suave); border-top: 1px solid var(--borde); }
  .leyenda span::before { content: ''; display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; background: var(--c); }
  /* Cambios */
  .cambios-filtros { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .cambios-filtros input, .cambios-filtros select { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 10px; padding: 7px 10px; font-size: 13px; }
  .cambios-filtros input { flex: 1 1 240px; min-width: 0; }
  .dia-titulo { font-size: 11px; font-weight: 700; letter-spacing: .03em; color: var(--suave); padding: 12px 14px 6px; }
  .cambio { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 10px; padding: 10px 14px; border-top: 1px solid var(--borde); cursor: pointer; }
  .cambio:hover { background: var(--acento-suave); }
  .cambio .hora { font-size: 12px; color: var(--suave); font-variant-numeric: tabular-nums; padding-top: 1px; }
  .cambio .valores { font-size: 12.5px; margin-top: 3px; overflow-wrap: anywhere; }
  .cambio del { color: var(--tenue); }
  .origen { font-size: 10.5px; font-weight: 700; border-radius: 6px; padding: 1px 6px; background: var(--campo); border: 1px solid var(--borde); color: var(--suave); margin-left: 6px; }
  @media (max-width: 900px) {
    .cal { grid-template-columns: 1fr; }
    .cal-dia { min-height: 64px; }
    .cal-ev { display: none; }
  }
  @media (max-width: 720px) {
    .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .kpis .kpi:first-child { grid-column: 1 / -1; }
    .col-ocultable { display: none; }
    td, th { padding: 9px 8px; }
    .detalles, .formulario { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="contenedor">
  <div class="barra">
    <h1>Formaciones complementarias</h1>
    <div class="sincro"><span class="punto cargando" id="punto"></span><span id="estado">Cargando…</span></div>
    <button class="boton" id="recargar" title="Leer la hoja de nuevo">Recargar</button>
  </div>

  <div class="kpis">
    <button class="kpi" data-etapa="" data-alerta=""><span>Registros</span><b id="k-total">–</b></button>
    <button class="kpi" data-etapa="POR_INICIAR"><span>Por iniciar (7 días)</span><b id="k-POR_INICIAR">–</b></button>
    <button class="kpi" data-etapa="EN_EJECUCION"><span>En ejecución</span><b id="k-EN_EJECUCION">–</b></button>
    <button class="kpi" data-etapa="POR_FINALIZAR"><span>Por finalizar (3 días)</span><b id="k-POR_FINALIZAR">–</b></button>
    <button class="kpi" data-alerta="*"><span>Con alertas</span><b id="k-alertas">–</b></button>
  </div>

  <div class="filtros">
    <div class="chips" id="chips"></div>
    <input id="buscar" type="search" placeholder="Buscar programa, instructor, ficha, empresa o municipio">
    <select id="f-mes"><option value="">Todos los meses</option></select>
    <select id="f-etapa"><option value="">Todas las etapas</option></select>
    <select id="f-alerta"><option value="">Todas las alertas</option></select>
    <select id="f-estado"><option value="">Todos los estados de ficha</option></select>
  </div>
  <div id="avisos"></div>

  <nav class="vistas" role="tablist">
    <button data-vista="calendario" class="activa">Calendario</button>
    <button data-vista="lista">Lista</button>
    <button data-vista="cambios">Cambios <small id="n-cambios" hidden></small></button>
  </nav>

  <section id="v-calendario" class="cal">
    <div class="cal-caja">
      <div class="cal-cabeza">
        <button class="cal-flecha" id="cal-ant" aria-label="Mes anterior">‹</button>
        <button class="cal-flecha" id="cal-sig" aria-label="Mes siguiente">›</button>
        <h2 id="cal-titulo"></h2>
        <button class="boton" id="cal-hoy">Hoy</button>
      </div>
      <div class="cal-grilla" id="cal-grilla"></div>
      <div class="leyenda" id="cal-leyenda"></div>
    </div>
    <div class="cal-caja dia-panel" id="dia-panel"></div>
  </section>

  <section id="v-cambios" hidden>
    <div class="cambios-filtros">
      <input id="buscar-cambios" type="search" placeholder="Buscar por persona, programa, ficha o campo">
      <select id="f-origen"><option value="">Desde cualquier lugar</option></select>
      <select id="f-quien"><option value="">Todas las personas</option></select>
    </div>
    <div class="lista" id="cambios-lista"></div>
  </section>

  <section id="v-lista" hidden>
  <div class="lista">
    <table>
      <thead>
        <tr>
          <th>Programa</th>
          <th>Ficha</th>
          <th class="col-ocultable">Fechas</th>
          <th class="col-ocultable">Empresa / municipio</th>
          <th>Estado</th>
          <th class="col-ocultable">Inscritos / matric.</th>
        </tr>
      </thead>
      <tbody id="filas"></tbody>
    </table>
    <div class="vacio" id="vacio" hidden>No hay registros con esos filtros.</div>
  </div>
  </section>
</div>

<div class="velo" id="velo"></div>
<aside class="cajon" id="cajon" aria-hidden="true">
  <header>
    <div>
      <span class="etiqueta hoja" id="c-hoja"></span>
      <h2 id="c-titulo"></h2>
      <div class="sub" id="c-sub"></div>
    </div>
    <button class="cerrar" id="cerrar" aria-label="Cerrar">×</button>
  </header>
  <div class="cuerpo">
    <div class="bloque-alertas" id="c-alertas"></div>
    <p class="seccion">Datos de la programación</p>
    <div class="detalles" id="c-detalles"></div>
    <p class="seccion">Seguimiento</p>
    <form class="formulario" id="c-form" autocomplete="off"></form>
  </div>
  <footer>
    <span class="mensaje" id="c-mensaje"></span>
    <button class="boton" id="descartar" type="button">Descartar</button>
    <button class="boton primario" id="guardar" type="button" disabled>Guardar</button>
  </footer>
</aside>
<div class="toast" id="toast"></div>

<script>
  var CLAVE = <?= clave ?>;
  var USUARIO = <?= usuario ?>; // nombre que manda KondID (vacío en el panel de la hoja)
  var ORIGEN = <?= origen ?>;
  var CADA_MS = 15000; // cada cuánto se pregunta si la hoja cambió
  var DETALLES = ['requerimiento', 'codigo', 'oferta', 'instructor', 'empresa', 'municipio', 'radicado', 'area', 'inicio', 'fin', 'horas', 'cupo', 'horario'];
  var MESES = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];

  var datos = null;
  var version = null;
  var filtro = { hoja: '', texto: '', mes: '', estado: '', etapa: '', alerta: '' };
  var abierto = null; // registro del cajón
  var cargando = false;
  var vista = 'calendario';
  var mesCal = null; // { anio, mes } que muestra el calendario
  var diaSel = null; // 'AAAA-MM-DD' elegido en el calendario
  var filtroCambios = { texto: '', origen: '', quien: '' };
  var verTodasEnCurso = false;
  var COLORES_HOJA = { REGULADA: '#0071E3', PV: '#0D9488', CAMPESENA: '#16A34A', TECNOACADEMIA: '#9333EA' };
  var DIAS_SEMANA = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];
  var resaltar = {};

  var $ = function (id) { return document.getElementById(id); };

  function llamar(funcion) {
    var argumentos = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolver, rechazar) {
      var r = google.script.run.withSuccessHandler(resolver).withFailureHandler(rechazar);
      r[funcion].apply(r, [CLAVE].concat(argumentos));
    });
  }

  function crear(etiqueta, clase, texto) {
    var el = document.createElement(etiqueta);
    if (clase) el.className = clase;
    if (texto != null) el.textContent = texto;
    return el;
  }

  function avisar(texto) {
    var t = $('toast');
    t.textContent = texto;
    t.classList.add('visible');
    clearTimeout(avisar.t);
    avisar.t = setTimeout(function () { t.classList.remove('visible'); }, 2600);
  }

  function ponerEstado(clase, texto) {
    $('punto').className = 'punto ' + clase;
    $('estado').textContent = texto;
  }

  function hora() {
    return new Date().toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }

  function fechaCorta(iso) {
    var p = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
    return p ? Number(p[3]) + ' ' + MESES[Number(p[2]) - 1].slice(0, 3).toLowerCase() : (iso || '');
  }

  // Una solicitud nueva puede no tener programa todavía: se muestra lo que pidió la empresa
  function titulo(r) {
    return r.campos.programa || (r.campos.requerimiento ? 'Solicitud: ' + r.campos.requerimiento : 'Sin programa');
  }

  function mesDe(r) {
    var p = /^\d{4}-(\d{2})/.exec(r.campos.inicio || '');
    if (p) return MESES[Number(p[1]) - 1];
    var m = (r.campos.mes || '').trim();
    return m ? m.charAt(0).toUpperCase() + m.slice(1).toLowerCase() : '';
  }

  // ─── Carga y sincronización ───

  function cargar(silencioso) {
    if (cargando) return Promise.resolve();
    cargando = true;
    if (!silencioso) ponerEstado('cargando', 'Cargando…');
    return llamar('obtenerDatos').then(function (d) {
      if (datos) marcarCambios(datos.registros, d.registros);
      datos = d;
      version = d.version;
      prepararFiltros();
      prepararFiltrosCambios();
      pintar();
      refrescarCajon();
      ponerEstado('', 'Al día · ' + hora());
    }).catch(function (e) {
      ponerEstado('error', 'Error: ' + (e && e.message || e));
    }).then(function () { cargando = false; });
  }

  function vigilar() {
    if (document.hidden || cargando) return;
    llamar('obtenerVersion').then(function (v) {
      if (v !== version) cargar(true);
      else ponerEstado('', 'Al día · ' + hora());
    }).catch(function () { ponerEstado('error', 'Sin conexión con la hoja'); });
  }

  function marcarCambios(antes, despues) {
    var previo = {};
    antes.forEach(function (r) { previo[r.id] = JSON.stringify(r.campos); });
    despues.forEach(function (r) {
      if (previo[r.id] !== undefined && previo[r.id] !== JSON.stringify(r.campos)) resaltar[r.id] = true;
    });
  }

  // ─── Filtros y lista ───

  function prepararFiltros() {
    var chips = $('chips');
    chips.textContent = '';
    var todas = [{ nombre: '', total: datos.registros.length, texto: 'Todas' }].concat(datos.hojas.map(function (h) {
      return { nombre: h.nombre, total: h.total, texto: h.nombre };
    }));
    todas.forEach(function (h) {
      var b = crear('button', 'chip' + (filtro.hoja === h.nombre ? ' activo' : ''), h.texto);
      b.appendChild(crear('small', '', String(h.total)));
      b.onclick = function () { filtro.hoja = h.nombre; prepararFiltros(); pintar(); };
      chips.appendChild(b);
    });

    llenarSelect($('f-mes'), unicos(datos.registros.map(mesDe)).sort(function (a, b) {
      return MESES.indexOf(a) - MESES.indexOf(b);
    }), filtro.mes, 'Todos los meses');
    var estados = unicos(datos.registros.map(function (r) { return (r.campos.estadoFicha || '').toUpperCase(); }));
    llenarSelect($('f-estado'), ['(sin estado)'].concat(estados.sort()), filtro.estado, 'Todos los estados de ficha');
    llenarOpciones($('f-etapa'), datos.etapas, filtro.etapa, 'Todas las etapas');
    llenarOpciones($('f-alerta'), datos.alertas, filtro.alerta === '*' ? '' : filtro.alerta, 'Todas las alertas');

    var avisos = $('avisos');
    avisos.textContent = '';
    datos.hojas.forEach(function (h) {
      if (h.aviso) avisos.appendChild(crear('div', 'aviso', h.nombre + ': ' + h.aviso));
    });
  }

  function unicos(lista) {
    var vistos = {};
    return lista.filter(function (x) { return x && !vistos[x] && (vistos[x] = true); });
  }

  function llenarSelect(select, valores, actual, primero) {
    select.textContent = '';
    select.appendChild(new Option(primero, ''));
    valores.forEach(function (v) { select.appendChild(new Option(v, v, false, v === actual)); });
  }

  function llenarOpciones(select, definiciones, actual, primero) {
    select.textContent = '';
    select.appendChild(new Option(primero, ''));
    Object.keys(definiciones).forEach(function (k) {
      select.appendChild(new Option(definiciones[k].etiqueta, k, false, k === actual));
    });
  }

  // Lo más urgente primero (inicia hoy, por iniciar, por finalizar...) y dentro de cada etapa por fecha de inicio
  function ordenar(lista) {
    return lista.slice().sort(function (a, b) {
      return (datos.etapas[a.etapa].orden - datos.etapas[b.etapa].orden) ||
        (a.inicioIso || '9').localeCompare(b.inicioIso || '9') || a.hoja.localeCompare(b.hoja) || a.fila - b.fila;
    });
  }

  function chipEtapa(r) {
    var e = datos.etapas[r.etapa];
    var chip = crear('span', 'etiqueta', e.etiqueta);
    chip.style.color = e.color;
    chip.style.background = e.fondo;
    chip.style.borderColor = 'transparent';
    return chip;
  }

  function chipsAlerta(r) {
    var caja = crear('div', 'chips-alerta');
    r.alertas.forEach(function (k) {
      var a = datos.alertas[k];
      var chip = crear('span', 'alerta', a.etiqueta);
      chip.style.color = a.color;
      chip.style.background = a.fondo;
      caja.appendChild(chip);
    });
    return caja;
  }

  function filtrados() {
    return datos.registros.filter(function (r) { return cumple(r, false); });
  }

  // sinEtapa: ignora los filtros de etapa y alerta (para los contadores de arriba)
  function cumple(r, sinEtapa, sinMes) {
    var c = r.campos;
    var texto = filtro.texto.trim().toLowerCase();
    if (filtro.hoja && r.hoja !== filtro.hoja) return false;
    if (filtro.mes && !sinMes && mesDe(r) !== filtro.mes) return false;
    if (!sinEtapa) {
      if (filtro.etapa && r.etapa !== filtro.etapa) return false;
      if (filtro.alerta === '*' ? !r.alertas.length : filtro.alerta && r.alertas.indexOf(filtro.alerta) < 0) return false;
    }
    if (filtro.estado) {
      var estado = (c.estadoFicha || '').toUpperCase();
      if (filtro.estado === '(sin estado)' ? estado : estado !== filtro.estado) return false;
    }
    if (texto) {
      var todo = [c.programa, c.requerimiento, c.instructor, c.ficha, c.oferta, c.empresa, c.municipio, c.radicado].join(' ').toLowerCase();
      if (todo.indexOf(texto) < 0) return false;
    }
    return true;
  }

  function pintar() {
    var lista = ordenar(filtrados());
    var tbody = $('filas');
    tbody.textContent = '';
    lista.forEach(function (r) {
      var c = r.campos;
      var tr = crear('tr', resaltar[r.id] ? 'cambiado' : '');
      tr.onclick = function () { abrir(r.id); };

      var td = crear('td');
      td.appendChild(crear('span', 'etiqueta hoja', r.hoja));
      td.appendChild(document.createTextNode(' '));
      td.appendChild(crear('span', 'titulo', titulo(r)));
      td.appendChild(crear('div', 'sub', c.instructor || 'Sin instructor'));
      if (r.alertas.length) td.appendChild(chipsAlerta(r));
      tr.appendChild(td);

      td = crear('td');
      td.appendChild(crear('span', 'etiqueta' + (c.ficha ? '' : ' vacia'), c.ficha || 'Sin ficha'));
      if (c.oferta) td.appendChild(crear('div', 'sub', 'Oferta ' + c.oferta));
      tr.appendChild(td);

      tr.appendChild(crear('td', 'col-ocultable sub', [fechaCorta(c.inicio), fechaCorta(c.fin)].filter(Boolean).join(' → ')));

      td = crear('td', 'col-ocultable');
      td.appendChild(crear('div', 'recorte', c.empresa || ''));
      td.appendChild(crear('div', 'sub recorte', c.municipio || ''));
      tr.appendChild(td);

      td = crear('td');
      td.appendChild(chipEtapa(r));
      if (r.detalleEtapa !== datos.etapas[r.etapa].etiqueta) td.appendChild(crear('div', 'sub', r.detalleEtapa));
      if (c.estadoFicha) td.appendChild(crear('div', 'sub', 'Ficha: ' + c.estadoFicha));
      if (c.estadoAprendices) td.appendChild(crear('div', 'sub', 'Aprendices: ' + c.estadoAprendices));
      tr.appendChild(td);

      tr.appendChild(crear('td', 'col-ocultable sub',
        ('inscritos' in c || 'matriculados' in c) ? (c.inscritos || '–') + ' / ' + (c.matriculados || '–') : ''));
      tbody.appendChild(tr);
    });
    resaltar = {};
    $('vacio').hidden = lista.length > 0;

    // Los contadores no dependen del filtro de etapa o alerta, para poder saltar de uno a otro
    var base = datos.registros.filter(function (r) { return cumple(r, true); });
    $('k-total').textContent = base.length;
    ['POR_INICIAR', 'EN_EJECUCION', 'POR_FINALIZAR'].forEach(function (e) {
      $('k-' + e).textContent = base.filter(function (r) { return r.etapa === e; }).length;
    });
    $('k-alertas').textContent = base.filter(function (r) { return r.alertas.length; }).length;
    Array.prototype.forEach.call(document.querySelectorAll('button.kpi'), function (b) {
      var activo = b.dataset.etapa ? b.dataset.etapa === filtro.etapa : b.dataset.alerta === '*' ? filtro.alerta === '*' : !filtro.etapa && !filtro.alerta;
      b.classList.toggle('activo', activo);
    });
    pintarCalendario();
    pintarCambios();
  }

  // ─── Vistas ───

  function cambiarVista(nueva) {
    vista = nueva;
    ['calendario', 'lista', 'cambios'].forEach(function (v) { $('v-' + v).hidden = v !== nueva; });
    Array.prototype.forEach.call(document.querySelectorAll('.vistas button'), function (b) {
      b.classList.toggle('activa', b.dataset.vista === nueva);
    });
    // El filtro de mes no aplica al calendario: ahí se navega por meses
    $('f-mes').hidden = nueva === 'calendario';
  }

  // ─── Calendario ───

  function iso(d) {
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  }

  function deIso(t) {
    return new Date(Number(t.slice(0, 4)), Number(t.slice(5, 7)) - 1, Number(t.slice(8, 10)));
  }

  function colorHoja(hoja) {
    return COLORES_HOJA[hoja] || '#64748B';
  }

  function delDia(lista, dia) {
    return {
      inician: lista.filter(function (r) { return r.inicioIso === dia; }),
      enCurso: lista.filter(function (r) { return r.inicioIso && r.finIso && r.inicioIso < dia && dia < r.finIso; }),
      finalizan: lista.filter(function (r) { return r.finIso === dia && r.inicioIso !== dia; }),
    };
  }

  function pintarCalendario() {
    if (!mesCal) {
      var hoy = deIso(datos.hoy);
      mesCal = { anio: hoy.getFullYear(), mes: hoy.getMonth() };
      diaSel = datos.hoy;
    }
    var lista = datos.registros.filter(function (r) { return cumple(r, false, true); });
    var primero = new Date(mesCal.anio, mesCal.mes, 1);
    $('cal-titulo').textContent = MESES[mesCal.mes] + ' ' + mesCal.anio;

    var grilla = $('cal-grilla');
    grilla.textContent = '';
    DIAS_SEMANA.forEach(function (d) { grilla.appendChild(crear('div', 'cal-sem', d)); });
    // La semana empieza el lunes
    var inicio = new Date(primero);
    inicio.setDate(1 - ((primero.getDay() + 6) % 7));
    var ultimo = new Date(mesCal.anio, mesCal.mes + 1, 0);
    var celdas = Math.ceil(((primero.getDay() + 6) % 7 + ultimo.getDate()) / 7) * 7;
    for (var i = 0; i < celdas; i++) {
      var fecha = new Date(inicio.getFullYear(), inicio.getMonth(), inicio.getDate() + i);
      grilla.appendChild(celdaDia(fecha, lista));
    }

    var leyenda = $('cal-leyenda');
    leyenda.textContent = '';
    Object.keys(COLORES_HOJA).forEach(function (h) {
      var l = crear('span', '', h);
      l.style.setProperty('--c', COLORES_HOJA[h]);
      leyenda.appendChild(l);
    });
    leyenda.appendChild(crear('span', 'sub', 'En cada día: las fichas que inician y cuántas siguen en curso'));
    pintarDia(lista);
  }

  function celdaDia(fecha, lista) {
    var dia = iso(fecha);
    var del = delDia(lista, dia);
    var clase = 'cal-dia' + (fecha.getMonth() !== mesCal.mes ? ' fuera' : '') + (dia === datos.hoy ? ' hoy' : '') + (dia === diaSel ? ' elegido' : '');
    var celda = crear('div', clase);
    celda.onclick = function () { diaSel = dia; verTodasEnCurso = false; pintarCalendario(); };
    celda.appendChild(crear('span', 'cal-num', String(fecha.getDate())));
    del.inician.slice(0, 3).forEach(function (r) {
      var ev = crear('div', 'cal-ev', titulo(r));
      ev.style.borderLeftColor = colorHoja(r.hoja);
      ev.title = r.hoja + ' · ' + titulo(r) + (r.campos.instructor ? ' · ' + r.campos.instructor : '');
      celda.appendChild(ev);
    });
    if (del.inician.length > 3) celda.appendChild(crear('span', 'cal-mas', '+' + (del.inician.length - 3) + ' más'));
    var partes = [];
    if (del.inician.length) partes.push(['▶', del.inician.length, 'inician']);
    if (del.enCurso.length) partes.push(['', del.enCurso.length, 'en curso']);
    if (del.finalizan.length) partes.push(['■', del.finalizan.length, 'terminan']);
    partes.forEach(function (p) {
      var linea = crear('span', 'cal-cuenta', (p[0] ? p[0] + ' ' : ''));
      linea.appendChild(crear('b', '', String(p[1])));
      linea.appendChild(document.createTextNode(' ' + p[2]));
      celda.appendChild(linea);
    });
    return celda;
  }

  function pintarDia(lista) {
    var panel = $('dia-panel');
    panel.textContent = '';
    var fecha = deIso(diaSel);
    panel.appendChild(crear('h3', '', fecha.toLocaleDateString('es-CO', { weekday: 'long', day: 'numeric', month: 'long' })));
    var del = delDia(lista, diaSel);
    var total = del.inician.length + del.enCurso.length + del.finalizan.length;
    panel.appendChild(crear('div', 'sub', total ? total + ' formaciones este día' : 'No hay formaciones este día con los filtros actuales'));
    [['Inician', del.inician], ['Terminan', del.finalizan], ['En curso', del.enCurso]].forEach(function (g) {
      if (!g[1].length) return;
      var grupo = crear('div', 'grupo');
      grupo.appendChild(crear('h4', '', g[0] + ' (' + g[1].length + ')'));
      // «En curso» puede ser muy larga: se muestran 8 y el resto con «Ver todas»
      var limite = g[0] === 'En curso' && !verTodasEnCurso ? 8 : Infinity;
      ordenar(g[1]).slice(0, limite).forEach(function (r) {
        var item = crear('div', 'item');
        item.style.borderLeftColor = colorHoja(r.hoja);
        item.onclick = function () { abrir(r.id); };
        item.appendChild(crear('div', 'titulo', titulo(r)));
        item.appendChild(crear('div', 'sub', [r.hoja, r.campos.ficha ? 'Ficha ' + r.campos.ficha : 'Sin ficha', r.campos.instructor].filter(Boolean).join(' · ')));
        item.appendChild(crear('div', 'sub', fechaCorta(r.inicioIso) + ' → ' + fechaCorta(r.finIso) + ' · ' + r.detalleEtapa));
        if (r.alertas.length) item.appendChild(chipsAlerta(r));
        grupo.appendChild(item);
      });
      if (g[1].length > limite) {
        var mas = crear('button', 'ver-mas', 'Ver las ' + g[1].length + ' en curso');
        mas.onclick = function () { verTodasEnCurso = true; pintarDia(lista); };
        grupo.appendChild(mas);
      }
      panel.appendChild(grupo);
    });
  }

  function moverMes(n) {
    var d = new Date(mesCal.anio, mesCal.mes + n, 1);
    mesCal = { anio: d.getFullYear(), mes: d.getMonth() };
    // Al cambiar de mes se elige el primer día (o hoy, si es el mes actual)
    diaSel = datos.hoy.slice(0, 7) === iso(d).slice(0, 7) ? datos.hoy : iso(d);
    pintarCalendario();
  }

  // ─── Cambios ───

  function prepararFiltrosCambios() {
    var origenes = unicos(datos.cambios.map(function (c) { return c.origen; })).sort();
    var personas = unicos(datos.cambios.map(function (c) { return c.quien; })).sort();
    llenarSelect($('f-origen'), origenes, filtroCambios.origen, 'Desde cualquier lugar');
    llenarSelect($('f-quien'), personas, filtroCambios.quien, 'Todas las personas');
    var hoy = datos.cambios.filter(function (c) { return c.fecha.slice(0, 10) === datos.hoy; }).length;
    $('n-cambios').hidden = !hoy;
    $('n-cambios').textContent = hoy + ' hoy';
  }

  function pintarCambios() {
    var caja = $('cambios-lista');
    caja.textContent = '';
    var texto = filtroCambios.texto.trim().toLowerCase();
    var lista = datos.cambios.filter(function (c) {
      if (filtroCambios.origen && c.origen !== filtroCambios.origen) return false;
      if (filtroCambios.quien && c.quien !== filtroCambios.quien) return false;
      return !texto || [c.quien, c.programa, c.ficha, c.campo, c.hoja, c.antes, c.despues].join(' ').toLowerCase().indexOf(texto) >= 0;
    });
    if (!lista.length) {
      caja.appendChild(crear('div', 'vacio', datos.cambios.length ? 'No hay cambios con esos filtros.' :
        'Todavía no hay cambios registrados. Aparecen aquí apenas alguien edite la hoja o guarde desde el panel.'));
      return;
    }
    var diaActual = null;
    lista.forEach(function (c) {
      var dia = c.fecha.slice(0, 10);
      if (dia !== diaActual) {
        diaActual = dia;
        caja.appendChild(crear('div', 'dia-titulo', nombreDia(dia)));
      }
      var fila = crear('div', 'cambio');
      fila.onclick = function () { abrirCambio(c); };
      fila.appendChild(crear('div', 'hora', c.fecha.slice(11, 16)));
      var cuerpo = crear('div');
      var quien = crear('div');
      var nombre = crear('b', '', c.quien);
      if (c.quien === 'Editor de la hoja') nombre.title = 'Google no entrega el correo de cuentas que no son de la organización dueña de la hoja';
      quien.appendChild(nombre);
      quien.appendChild(crear('span', 'origen', c.origen));
      cuerpo.appendChild(quien);
      cuerpo.appendChild(crear('div', 'sub', 'Cambió «' + c.campo + '» en ' + (c.programa || 'un registro') +
        ' · ' + (c.ficha ? 'Ficha ' + c.ficha + ' · ' : '') + c.hoja + ' fila ' + c.fila));
      var valores = crear('div', 'valores');
      if (c.antes) {
        valores.appendChild(crear('del', '', c.antes));
        valores.appendChild(document.createTextNode(' → '));
      }
      valores.appendChild(crear('b', '', c.despues || '(vacío)'));
      cuerpo.appendChild(valores);
      fila.appendChild(cuerpo);
      caja.appendChild(fila);
    });
  }

  function nombreDia(dia) {
    var ayer = new Date(deIso(datos.hoy).getTime() - 86400000);
    if (dia === datos.hoy) return 'Hoy';
    if (dia === iso(ayer)) return 'Ayer';
    return deIso(dia).toLocaleDateString('es-CO', { weekday: 'long', day: 'numeric', month: 'long' });
  }

  function abrirCambio(c) {
    var r = datos.registros.filter(function (x) { return (c.ficha && x.campos.ficha === c.ficha) || x.id === c.id; })[0];
    if (r) abrir(r.id);
    else avisar('Ese registro ya no está en la hoja');
  }

  // ─── Cajón de edición ───

  function buscar(id) {
    return datos.registros.filter(function (r) { return r.id === id; })[0] || null;
  }

  function editablesDe(r) {
    var hoja = datos.hojas.filter(function (h) { return h.nombre === r.hoja; })[0];
    return hoja ? hoja.editables : [];
  }

  function abrir(id) {
    abierto = buscar(id);
    if (!abierto) return;
    pintarCajon(true);
    $('cajon').classList.add('abierto');
    $('velo').classList.add('abierto');
    $('cajon').setAttribute('aria-hidden', 'false');
  }

  function cerrar() {
    if (hayCambios() && !confirm('Hay cambios sin guardar. ¿Descartarlos?')) return;
    abierto = null;
    $('cajon').classList.remove('abierto');
    $('velo').classList.remove('abierto');
    $('cajon').setAttribute('aria-hidden', 'true');
  }

  function pintarCajon(completo) {
    var r = abierto;
    var c = r.campos;
    $('c-hoja').textContent = r.hoja + ' · fila ' + r.fila;
    $('c-titulo').textContent = titulo(r);
    $('c-sub').textContent = c.ficha ? 'Ficha ' + c.ficha : 'Sin ficha';

    var alertas = $('c-alertas');
    alertas.textContent = '';
    var linea = crear('div');
    linea.appendChild(chipEtapa(r));
    if (r.detalleEtapa !== datos.etapas[r.etapa].etiqueta) linea.appendChild(document.createTextNode(' ' + r.detalleEtapa));
    alertas.appendChild(linea);
    if (r.alertas.length) alertas.appendChild(chipsAlerta(r));
    [['Se cruza con', r.cruces], ['Distinto en otra pestaña', r.inconsistencias], ['Cambios recientes', r.cambiosRecientes]].forEach(function (par) {
      if (!par[1] || !par[1].length) return;
      alertas.appendChild(crear('p', 'sub', par[0] + ':'));
      var ul = crear('ul', 'nota');
      par[1].forEach(function (t) { ul.appendChild(crear('li', '', t)); });
      alertas.appendChild(ul);
    });

    var detalles = $('c-detalles');
    detalles.textContent = '';
    DETALLES.forEach(function (k) {
      if (!(k in c)) return;
      var d = crear('div');
      d.appendChild(crear('span', '', datos.campos[k].titulo));
      d.appendChild(document.createTextNode(datos.campos[k].tipo === 'fecha' ? fechaCorta(c[k]) || '–' : c[k] || '–'));
      detalles.appendChild(d);
    });

    if (!completo) return;
    var form = $('c-form');
    form.textContent = '';
    var editables = editablesDe(r);
    if (!editables.length) form.appendChild(crear('p', 'sub', 'Esta pestaña no tiene columnas de seguimiento.'));
    editables.forEach(function (k) {
      var def = datos.campos[k];
      var caja = crear('div', def.largo ? 'ancho' : '');
      var etiqueta = crear('label', '', def.titulo);
      etiqueta.htmlFor = 'e-' + k;
      var campo = def.largo ? crear('textarea') : crear('input');
      campo.id = 'e-' + k;
      campo.name = k;
      if (!def.largo) campo.type = def.tipo === 'fecha' ? 'date' : def.tipo === 'numero' ? 'number' : 'text';
      if (def.tipo === 'numero') campo.min = '0';
      var valor = c[k] || '';
      // Una fecha escrita a mano en la hoja (no ISO) no cabe en un campo de fecha: se muestra como texto
      if (def.tipo === 'fecha' && valor && !/^\d{4}-\d{2}-\d{2}$/.test(valor)) campo.type = 'text';
      campo.value = valor;
      campo.dataset.original = valor;
      if (datos.opciones[k] && datos.opciones[k].length) {
        var lista = crear('datalist');
        lista.id = 'o-' + k;
        datos.opciones[k].forEach(function (o) { lista.appendChild(new Option(o)); });
        caja.appendChild(lista);
        campo.setAttribute('list', lista.id);
      }
      campo.oninput = actualizarBotones;
      caja.appendChild(etiqueta);
      caja.appendChild(campo);
      form.appendChild(caja);
    });
    $('c-mensaje').textContent = '';
    actualizarBotones();
  }

  function camposForm() {
    return Array.prototype.slice.call($('c-form').querySelectorAll('input, textarea'));
  }

  function hayCambios() {
    return abierto && camposForm().some(function (el) { return el.value.trim() !== el.dataset.original.trim(); });
  }

  function actualizarBotones() {
    camposForm().forEach(function (el) {
      el.classList.toggle('modificado', el.value.trim() !== el.dataset.original.trim());
    });
    $('guardar').disabled = !hayCambios();
  }

  // Al llegar datos nuevos: si no se ha tocado el formulario se muestra lo último de la hoja
  function refrescarCajon() {
    if (!abierto) return;
    var nuevo = buscar(abierto.id);
    if (!nuevo || nuevo.huella !== abierto.huella) {
      $('c-mensaje').textContent = 'Este registro cambió de lugar en la hoja. Ciérralo y ábrelo de nuevo.';
      $('guardar').disabled = true;
      return;
    }
    var tocado = hayCambios();
    abierto = nuevo;
    pintarCajon(!tocado);
  }

  function guardar() {
    var cambios = {};
    camposForm().forEach(function (el) {
      if (el.value.trim() !== el.dataset.original.trim()) cambios[el.name] = { anterior: el.dataset.original, nuevo: el.value };
    });
    $('guardar').disabled = true;
    $('c-mensaje').textContent = 'Guardando…';
    llamar('guardar', abierto.id, abierto.huella, cambios, { nombre: USUARIO, origen: ORIGEN }).then(function (res) {
      if (!res.ok) {
        $('c-mensaje').textContent = 'Alguien cambió estos datos mientras editabas. Revisa y vuelve a guardar.';
        res.conflictos.forEach(function (cf) {
          var el = $('e-' + cf.campo);
          if (!el) return;
          el.dataset.original = cf.actual || '';
          var nota = crear('div', 'conflicto', 'En la hoja ahora dice: ' + (cf.actual || '(vacío)'));
          el.parentNode.appendChild(nota);
        });
        actualizarBotones();
        return;
      }
      var i = datos.registros.map(function (r) { return r.id; }).indexOf(res.registro.id);
      // Lo editable no cambia fechas, ficha ni instructor: la etapa y las alertas siguen igual
      ['etapa', 'detalleEtapa', 'inicioIso', 'finIso', 'alertas', 'cruces', 'inconsistencias'].forEach(function (k) {
        if (abierto[k] !== undefined) res.registro[k] = abierto[k];
      });
      if (i >= 0) datos.registros[i] = res.registro;
      version = res.version;
      abierto = res.registro;
      resaltar[res.registro.id] = true;
      pintar();
      pintarCajon(true);
      avisar('Guardado en la hoja');
      cargar(true); // trae el cambio a «Cambios» y recalcula las alertas
    }).catch(function (e) {
      $('c-mensaje').textContent = (e && e.message) || 'No se pudo guardar';
      actualizarBotones();
    });
  }

  // ─── Eventos ───

  $('recargar').onclick = function () { cargar(false); };
  $('buscar').oninput = function (e) { filtro.texto = e.target.value; pintar(); };
  $('f-mes').onchange = function (e) { filtro.mes = e.target.value; pintar(); };
  $('f-estado').onchange = function (e) { filtro.estado = e.target.value; pintar(); };
  $('f-etapa').onchange = function (e) { filtro.etapa = e.target.value; pintar(); };
  $('f-alerta').onchange = function (e) { filtro.alerta = e.target.value; pintar(); };
  Array.prototype.forEach.call(document.querySelectorAll('button.kpi'), function (b) {
    b.onclick = function () {
      filtro.etapa = b.dataset.etapa || '';
      filtro.alerta = b.dataset.alerta || '';
      $('f-etapa').value = filtro.etapa;
      $('f-alerta').value = filtro.alerta === '*' ? '' : filtro.alerta;
      cambiarVista('lista');
      pintar();
    };
  });
  $('cerrar').onclick = cerrar;
  Array.prototype.forEach.call(document.querySelectorAll('.vistas button'), function (b) {
    b.onclick = function () { cambiarVista(b.dataset.vista); };
  });
  $('cal-ant').onclick = function () { moverMes(-1); };
  $('cal-sig').onclick = function () { moverMes(1); };
  $('cal-hoy').onclick = function () { mesCal = null; pintarCalendario(); };
  $('buscar-cambios').oninput = function (e) { filtroCambios.texto = e.target.value; pintarCambios(); };
  $('f-origen').onchange = function (e) { filtroCambios.origen = e.target.value; pintarCambios(); };
  $('f-quien').onchange = function (e) { filtroCambios.quien = e.target.value; pintarCambios(); };
  $('velo').onclick = cerrar;
  $('guardar').onclick = guardar;
  $('descartar').onclick = function () { if (abierto) pintarCajon(true); };
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && abierto) cerrar(); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) vigilar(); });

  cambiarVista('calendario');
  cargar(false);
  setInterval(vigilar, CADA_MS);
</script>
</body>
</html>
